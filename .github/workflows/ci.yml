name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (locked)
        run: cargo test --locked --manifest-path compiler/Cargo.toml
      - name: Release build
        run: cargo build --release --locked --manifest-path compiler/Cargo.toml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the checksummed artifact
        run: scripts/release.sh
      - name: Keep the artifact
        uses: actions/upload-artifact@v4
        with:
          name: umay-release
          path: out/*
