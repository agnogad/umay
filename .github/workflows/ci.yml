name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (locked)
        run: cargo test --locked --manifest-path compiler/Cargo.toml
      - name: Release build
        run: cargo build --release --locked --manifest-path compiler/Cargo.toml

  macos:
    # A Linux host can only assert that the Mach-O object is well formed. This
    # job links and runs a real program on an Intel Mac: the backend emits
    # x86_64 objects, and an arm64 runner cannot link them against its own libc.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the compiler
        run: cargo build --release --locked --manifest-path compiler/Cargo.toml
      - name: Link and run a macOS binary
        run: |
          mkdir -p "$RUNNER_TEMP/umay-smoke"
          cd "$RUNNER_TEMP/umay-smoke"
          printf 'fn main() -> i32 {\n    println("mac")\n    return 0\n}\n' > main.um
          "$GITHUB_WORKSPACE/target/release/umay" build main.um
          test "$(./dist/main)" = mac
      - name: Package the macOS artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 scripts/package.py \
            --version "${GITHUB_REF_NAME#v}" \
            --label x86_64-darwin \
            --binary target/release/umay \
            --out out \
            --strip
      - name: Keep the macOS artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: umay-release-macos
          path: out/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          foreach ($dir in @("C:\msys64\mingw64\bin", "C:\mingw64\bin", "C:\tools\mingw64\bin")) {
            if (Test-Path $dir) {
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            }
          }
      - name: Test (locked)
        run: cargo test --locked --manifest-path compiler/Cargo.toml
      - name: Release build
        run: cargo build --release --locked --manifest-path compiler/Cargo.toml
      - name: Link and run a Windows binary
        shell: pwsh
        run: |
          if (-not (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue)) {
            Write-Host "MinGW-w64 is not installed; skipping the native link smoke"
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP "umay-smoke"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Location $dir
          @(
            'fn main() -> i32 {'
            '    println("win")'
            '    return 0'
            '}'
          ) | Set-Content -Encoding utf8 main.um
          & "$env:GITHUB_WORKSPACE\target\release\umay.exe" build main.um
          if ((& ".\dist\main.exe") -ne "win") { exit 1 }
      - name: Package the Windows artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          python scripts/package.py `
            --version $version `
            --label x86_64-windows `
            --binary target/release/umay.exe `
            --out out
      - name: Keep the Windows artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: umay-release-windows
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the static Linux target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build the checksummed artifact
        run: scripts/release.sh
      - name: Check the Linux artifact is static
        run: |
          binary="$(find out -maxdepth 2 -name umay -type f | head -n 1)"
          test -n "$binary"
          if ldd "$binary" 2>&1 | grep -q "libc\.so"; then
            echo "error: the release binary still depends on the host glibc" >&2
            ldd "$binary" >&2
            exit 1
          fi
      - name: Keep the Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: umay-release-linux
          path: out/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every platform artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          mapfile -t files < <(find artifacts -maxdepth 1 -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "error: no release artifacts were downloaded" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "umay ${tag#v}" --generate-notes
          fi
