name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (locked)
        run: cargo test --locked --manifest-path compiler/Cargo.toml
      - name: Clippy
        run: cargo clippy --all-targets --locked --manifest-path compiler/Cargo.toml -- -D warnings
      - name: Release build
        run: cargo build --release --locked --manifest-path compiler/Cargo.toml

  # v2 gate enforcement. Gates default off, so the default-corpus step must stay
  # green on its own; the gated step proves the v2-gates feature and its suite.
  # Both are merge-blocking (no continue-on-error, no needs cycle).
  v2-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test v2 gates
        run: cargo test --locked --features v2-gates --manifest-path compiler/Cargo.toml
      - name: Test default corpus (locked)
        run: cargo test --locked --manifest-path compiler/Cargo.toml

  # UI snapshot harness. BLESS is intentionally unset: a stale snapshot fails
  # the run and blocks the PR. Updates require a reviewed `BLESS=1` run.
  v2-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: UI snapshots (locked)
        run: cargo test --locked --test ui --manifest-path compiler/Cargo.toml

  macos:
    # A Linux host can only assert that the Mach-O object is well formed. This
    # job links and runs a real program on an Intel Mac: the backend emits
    # x86_64 objects, and an arm64 runner cannot link them against its own libc.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the compiler
        run: cargo build --release --locked --manifest-path compiler/Cargo.toml
      - name: Link and run a macOS binary
        run: |
          mkdir -p "$RUNNER_TEMP/umay-smoke"
          cd "$RUNNER_TEMP/umay-smoke"
          printf 'fn main() -> i32 {\n    println("mac")\n    return 0\n}\n' > main.um
          "$GITHUB_WORKSPACE/target/release/umay" build main.um
          test "$(./dist/main)" = mac
      - name: Package the macOS artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 scripts/package.py \
            --version "${GITHUB_REF_NAME#v}" \
            --label x86_64-darwin \
            --binary target/release/umay \
            --out out \
            --strip
      - name: Keep the macOS artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: umay-release-macos
          path: out/*

  aarch64:
    # A native emulator turn: install the ARM64 C library and qemu, build a
    # program with the AArch64 backend, and run it. Assembling is not enough to
    # prove the calling convention, frame layout or runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the cross linker and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
      - name: Build the compiler
        run: cargo build --release --locked --manifest-path compiler/Cargo.toml
      - name: Build and run an AArch64 program
        run: |
          dir="$RUNNER_TEMP/umay-arm64"
          mkdir -p "$dir"
          cd "$dir"
          cat > main.um <<'EOF'
          enum Kind { A(i64), B }

          struct Pair {
              a: i64,
              b: f64,
          }

          fn add(a: i64, b: i64) -> i64 {
              return a + b
          }

          fn sum(p: Pair) -> f64 {
              return p.a as f64 + p.b
          }

          fn make() -> Pair {
              return Pair { a: 40i64, b: 2.0f64 }
          }

          fn nine(a: i64, b: i64, c: i64, d: i64, e: i64, f: i64, g: i64, h: i64, i: i64) -> i64 {
              return a + b + c + d + e + f + g + h + i
          }

          fn main() -> i32 {
              println("arm64")
              println_i64(add(40i64, 2i64))
              let p = make()
              println_i64(sum(p) as i64)
              let k = Kind::A(42i64)
              match k {
                  Kind::A(x) => println_i64(x),
                  Kind::B => println_i64(0i64),
              }
              let t = (1i64, 41i64)
              println_i64(t.0 + t.1)
              println_i64((1.5f64 + 0.5f64) as i64)
              println_i64(nine(1i64, 2i64, 3i64, 4i64, 5i64, 6i64, 7i64, 8i64, 6i64))
              return 0
          }
          EOF
          "$GITHUB_WORKSPACE/target/release/umay" build --target aarch64-unknown-linux-gnu main.um
          qemu-aarch64 -L /usr/aarch64-linux-gnu ./dist/main > output.txt
          printf 'arm64\n42\n42\n42\n42\n2\n42\n' > expected.txt
          diff -u expected.txt output.txt
      - name: Check HFA calls against C
        run: |
          dir="$RUNNER_TEMP/umay-hfa"
          mkdir -p "$dir"
          cd "$dir"
          cat > main.um <<'EOF'
          struct Pair { a: f64, b: f64 }
          extern fn "make_pair" make_pair() -> Pair
          extern fn "sum_pair" sum_pair(p: Pair) -> f64
          fn main() -> i32 {
              let p = make_pair()
              println_i64(sum_pair(p) as i64)
              return 0
          }
          EOF
          cat > helper.c <<'EOF'
          struct Pair { double a; double b; };
          struct Pair make_pair(void) { struct Pair p = { 40.0, 2.0 }; return p; }
          double sum_pair(struct Pair p) { return p.a + p.b; }
          EOF
          "$GITHUB_WORKSPACE/target/release/umay" build --target aarch64-unknown-linux-gnu --emit-object-only main.um
          aarch64-linux-gnu-gcc -c -O2 helper.c -o helper.o
          aarch64-linux-gnu-gcc -static -o hfa dist/main.o dist/umay_runtime.o helper.o
          output="$(qemu-aarch64 -L /usr/aarch64-linux-gnu ./hfa)"
          test "$output" = 42
      # Vtable ABI conformance (AAPCS64 under qemu). Two concrete impls of one
      # trait are held as trait objects and called indirectly, so each call must
      # go through its own vtable. Exact stdout diff, no skip: the qemu and
      # cross toolchain are installed by this job above, so failure is a failure.
      - name: Check vtable dispatch (AArch64, qemu)
        run: |
          dir="$RUNNER_TEMP/umay-arm64-vtable"
          mkdir -p "$dir"
          cd "$dir"
          cat > main.um <<'EOF'
          trait Shape { fn area(&self) -> i64 }
          struct Square { side: i64 }
          struct Rect { w: i64, h: i64 }
          impl Shape for Square { fn area(&self) -> i64 { return self.side * self.side } }
          impl Shape for Rect { fn area(&self) -> i64 { return self.w * self.h } }
          fn main() -> i32 {
              let s = Square { side: 5 }
              let r = Rect { w: 3i64, h: 4i64 }
              let a: dyn Shape = &s
              let b: dyn Shape = &r
              println_i64(a.area())
              println_i64(b.area())
              return 0
          }
          EOF
          "$GITHUB_WORKSPACE/target/release/umay" build --target aarch64-unknown-linux-gnu main.um
          qemu-aarch64 -L /usr/aarch64-linux-gnu ./dist/main > output.txt
          printf '25\n12\n' > expected.txt
          diff -u expected.txt output.txt

      - name: Build and run the AArch64 compiler
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --locked --target aarch64-unknown-linux-musl
          qemu-aarch64 target/aarch64-unknown-linux-musl/release/umay version

  macos-arm:
    # This repository is private, and GitHub does not offer the standard arm64
    # macOS runner to it: `macos-26` queued and was cancelled after fifteen
    # minutes. This job cross-builds the ARM64 compiler and checks that both it
    # and a generated object are arm64. Native execution is covered by the
    # AArch64 Linux qemu job and Windows ARM64; a real Apple Silicon run needs
    # a runner this repository can obtain.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the compiler
        run: cargo build --release --locked --manifest-path compiler/Cargo.toml
      - name: Cross-build the ARM64 compiler and check its objects
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          file target/aarch64-apple-darwin/release/umay > compiler-arch.txt
          cat compiler-arch.txt
          grep -q "arm64" compiler-arch.txt

          dir="$RUNNER_TEMP/umay-mac-arm"
          mkdir -p "$dir"
          cd "$dir"
          cat > main.um <<'EOF'
          struct Pair { a: i64, b: i64 }

          fn main() -> i32 {
              println("mac-arm")
              let p = Pair { a: 40i64, b: 2i64 }
              println_i64(p.a + p.b)
              return 0
          }
          EOF
          "$GITHUB_WORKSPACE/target/release/umay" asm --target aarch64-apple-darwin main.um > main.s
          clang -c --target=arm64-apple-darwin main.s -o main.o
          file main.o > object-arch.txt
          cat object-arch.txt
          grep -q "arm64" object-arch.txt
      - name: Package the ARM64 macOS artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 scripts/package.py \
            --version "${GITHUB_REF_NAME#v}" \
            --label aarch64-darwin \
            --binary target/aarch64-apple-darwin/release/umay \
            --out out \
            --strip
      - name: Keep the ARM64 macOS artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: umay-release-macos-arm
          path: out/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add MinGW to PATH
        shell: pwsh
        run: |
          foreach ($dir in @("C:\msys64\mingw64\bin", "C:\mingw64\bin", "C:\tools\mingw64\bin")) {
            if (Test-Path $dir) {
              $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            }
          }
      - name: Unit tests (locked)
        run: cargo test --locked --lib --manifest-path compiler/Cargo.toml
      - name: Release build
        run: cargo build --release --locked --manifest-path compiler/Cargo.toml
      - name: Link and run a Windows binary
        shell: pwsh
        run: |
          if (-not (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue)) {
            Write-Host "MinGW-w64 is not installed; skipping the native link smoke"
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP "umay-smoke"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Location $dir
          @(
            'fn main() -> i32 {'
            '    println("win")'
            '    return 0'
            '}'
          ) | Set-Content -Encoding utf8 main.um
          & "$env:GITHUB_WORKSPACE\target\release\umay.exe" build main.um
          if ((& ".\dist\main.exe") -ne "win") { exit 1 }
      - name: Package the Windows artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          python scripts/package.py `
            --version $version `
            --label x86_64-windows `
            --binary target/release/umay.exe `
            --out out
      - name: Keep the Windows artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: umay-release-windows
          path: out/*

  windows-arm:
    # Native Windows on ARM: build the compiler on an ARM64 runner, assemble
    # and link with llvm-mingw's aarch64 toolchain, then run the PE. A cross
    # link on x86_64 proves the object and import table; this proves the
    # program's calls and startup actually execute.
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install llvm-mingw for AArch64
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "llvm-mingw.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-ucrt-aarch64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Join-Path $env:RUNNER_TEMP "llvm-mingw-20261104-ucrt-aarch64/bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build the compiler
        run: cargo build --release --locked --manifest-path compiler/Cargo.toml
      - name: Link and run an ARM64 Windows binary
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "umay-win-arm"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Location $dir
          @(
            'fn main() -> i32 {'
            '    println("win-arm")'
            '    println_i64(40i64 + 2i64)'
            '    return 0'
            '}'
          ) | Set-Content -Encoding utf8 main.um
          & "$env:GITHUB_WORKSPACE\target\release\umay.exe" build --target aarch64-w64-mingw32 main.um
          $out = (& ".\dist\main.exe") -join "`n"
          if ($out -ne "win-arm`n42") {
            Write-Error "unexpected output: $out"
            exit 1
          }
      # Microsoft ARM64 passes aggregates of 1/2/4/8 bytes in x0 and everything
      # else by reference (hidden pointer for returns). The sizes below are ones
      # where UMAY and the C compiler agree; a 16-byte aggregate is deliberately
      # not used because AAPCS64 (UMAY) splits it across x0/x1 while Microsoft's
      # variant passes it by reference. This step is the exit-criterion-3 gate.
      - name: Check Microsoft ARM64 aggregates against C
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "umay-win-arm-agg"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Location $dir
          @(
            'struct B1 { a: i8 }'
            'struct B2 { a: i16 }'
            'struct B4 { a: i32 }'
            'struct B8 { a: i64 }'
            'struct B24 { a: i64, b: i64, c: i64 }'
            'extern fn "ms_echo_b1" ms_echo_b1(s: B1) -> B1'
            'extern fn "ms_echo_b2" ms_echo_b2(s: B2) -> B2'
            'extern fn "ms_echo_b4" ms_echo_b4(s: B4) -> B4'
            'extern fn "ms_echo_b8" ms_echo_b8(s: B8) -> B8'
            'extern fn "ms_sum_b24" ms_sum_b24(b: B24) -> i64'
            'extern fn "ms_make_b24" ms_make_b24(v: i64) -> B24'
            'fn main() -> i32 {'
            '    println_i64((ms_echo_b1(B1 { a: 1i8 })).a as i64)'
            '    println_i64((ms_echo_b2(B2 { a: 2i16 })).a as i64)'
            '    println_i64((ms_echo_b4(B4 { a: 3i32 })).a as i64)'
            '    println_i64((ms_echo_b8(B8 { a: 4i64 })).a as i64)'
            '    let b = ms_make_b24(10i64)'
            '    println_i64(b.a + b.b + b.c)'
            '    println_i64(ms_sum_b24(B24 { a: 5i64, b: 6i64, c: 7i64 }))'
            '    return 0'
            '}'
          ) | Set-Content -Encoding utf8 main.um
          @(
            'struct B1 { signed char a; };'
            'struct B2 { short a; };'
            'struct B4 { int a; };'
            'struct B8 { long long a; };'
            'struct B24 { long long a, b, c; };'
            'struct B1 ms_echo_b1(struct B1 s) { return s; }'
            'struct B2 ms_echo_b2(struct B2 s) { return s; }'
            'struct B4 ms_echo_b4(struct B4 s) { return s; }'
            'struct B8 ms_echo_b8(struct B8 s) { return s; }'
            'struct B24 ms_make_b24(long long v) { struct B24 b = { v, v+1, v+2 }; return b; }'
            'long long ms_sum_b24(struct B24 b) { return b.a + b.b + b.c; }'
          ) | Set-Content -Encoding utf8 helper.c
          & "$env:GITHUB_WORKSPACE\target\release\umay.exe" build --target aarch64-w64-mingw32 --emit-object-only main.um
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          aarch64-w64-mingw32-gcc -c -O2 helper.c -o helper.o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          aarch64-w64-mingw32-gcc -o dist\agg.exe dist\main.o dist\umay_runtime.o helper.o -mconsole -lws2_32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = (& ".\dist\agg.exe") -join "`n"
          if ($out -ne "1`n2`n3`n4`n33`n18") {
            Write-Error "unexpected Microsoft ARM64 aggregate output: $out"
            exit 1
          }
      - name: Package the ARM64 Windows artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          python scripts/package.py `
            --version $version `
            --label aarch64-windows `
            --binary target/release/umay.exe `
            --out out
      - name: Keep the ARM64 Windows artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: umay-release-windows-arm
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the static Linux target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build the checksummed artifact
        run: scripts/release.sh
      - name: Check the Linux artifact is static
        run: |
          binary="$(find out -maxdepth 2 -name umay -type f | head -n 1)"
          test -n "$binary"
          if ldd "$binary" 2>&1 | grep -q "libc\.so"; then
            echo "error: the release binary still depends on the host glibc" >&2
            ldd "$binary" >&2
            exit 1
          fi
      - name: Keep the Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: umay-release-linux
          path: out/*

  release-aarch64:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the static AArch64 target
        run: rustup target add aarch64-unknown-linux-musl
      - name: Build the static AArch64 compiler
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: cargo build --release --locked --target aarch64-unknown-linux-musl
      - name: Package the AArch64 artifact
        run: |
          python3 scripts/package.py \
            --version "${GITHUB_REF_NAME#v}" \
            --label aarch64-linux-musl \
            --binary target/aarch64-unknown-linux-musl/release/umay \
            --out out \
            --strip
      - name: Keep the AArch64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: umay-release-aarch64
          path: out/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, release-aarch64, macos, macos-arm, windows, windows-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every platform artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          mapfile -t files < <(find artifacts -maxdepth 1 -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "error: no release artifacts were downloaded" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "umay ${tag#v}" --generate-notes
          fi
