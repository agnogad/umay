<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>UMAY Notlar</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: #10131a; color: #e8ecf4; }
  header { padding: 18px 22px 10px; }
  h1 { margin: 0; font-size: 22px; color: #7fd1b9; letter-spacing: .5px; }
  .sub { color: #8892a6; font-size: 12px; margin-top: 4px; }
  main { padding: 6px 22px 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 14px; }
  input { flex: 1; padding: 9px 11px; border-radius: 7px; border: 1px solid #2b3444;
          background: #171c26; color: #e8ecf4; outline: none; }
  button { padding: 9px 14px; border: 0; border-radius: 7px; background: #2f7d68;
           color: white; cursor: pointer; font-weight: 600; }
  button:hover { background: #3b9a80; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
       background: #171c26; border: 1px solid #232b39; border-radius: 7px; margin-bottom: 8px; }
  li.done span { text-decoration: line-through; color: #6f7a8d; }
  .dot { flex: 0 0 9px; width: 9px; height: 9px; border-radius: 50%; background: #7fd1b9; }
  li.done .dot { background: #4a5568; }
  span { flex: 1; }
  .del { background: transparent; color: #e07a7a; padding: 2px 7px; font-size: 16px; }
  footer { padding: 8px 22px; color: #556075; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>UMAY Notlar</h1>
  <div class="sub">Webview backend &middot; HTML aray&uuml;z &middot; ger&ccedil;ek GTK penceresi</div>
</header>
<main>
  <div class="row"><input id="txt" placeholder="Yeni not..." autofocus><button onclick="add()">Ekle</button></div>
  <ul id="list"></ul>
</main>
<footer>UMAY v2 &middot; Faz 5 webview &middot; IPC haz&yacute;r</footer>
<script>
  const items = [
    {text: 'Closure ve trait sistemi', done: true},
    {text: 'SDL3 immediate-mode UI', done: true},
    {text: 'WebKitGTK webview backend', done: false},
    {text: 'Async executor ve reactor', done: false}
  ];
  function render() {
    document.getElementById('list').innerHTML = items.map((it, i) =>
      '<li class="' + (it.done ? 'done' : '') + '"><span class="dot"></span>' +
      '<span onclick="toggle(' + i + ')">' + it.text + '</span>' +
      '<button class="del" onclick="del(' + i + ')">&times;</button></li>').join('');
  }
  function add() {
    const el = document.getElementById('txt');
    if (el.value.trim()) { items.push({text: el.value.trim(), done: false}); el.value = ''; render(); }
  }
  function toggle(i) { items[i].done = !items[i].done; render(); }
  function del(i) { items.splice(i, 1); render(); }
  document.getElementById('txt').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
  render();
</script>
</body>
</html>
