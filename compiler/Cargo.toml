[package]
name = "umayc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The UMAY compiler (umay) - reference frontend and custom backend"

[[bin]]
name = "umay"
path = "src/main.rs"

[features]
# Reserved v2 gate. No code is gated by this in the foundation slice; the flag
# exists so `cargo test --features proc_macro` is a valid command.
proc_macro = []
# Opt-in compiler enforcement of crate-level `#![feature(...)]` gates. Default
# builds do no gate checking, so every v1 source stays valid by default.
v2-gates = []

[dependencies]

[dev-dependencies]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
